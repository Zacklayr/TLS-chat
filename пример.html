<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TLS Chat v1.0</title>
<style>
  :root {
    --bg: #0a0d14;
    --panel: #141a26;
    --panel-2: #1b2334;
    --well: #070a11;
    --border: #2b3650;
    --border-hi: #4a5a80;
    --text: #d6deeb;
    --muted: #7d8aa6;
    --faint: #4f5b78;
    --accent: #39ff88;
    --accent-2: #31c3ff;
    --warn: #ffcc66;
    --danger: #ff5f7a;
    --title-a: #1d3b7a;
    --title-b: #0c1830;
    --in: #1a2232;
    --out: #173d2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      linear-gradient(rgba(49,195,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(49,195,255,0.04) 1px, transparent 1px),
      radial-gradient(ellipse at top, #15203a 0%, var(--bg) 70%);
    background-size: 24px 24px, 24px 24px, auto;
    color: var(--text);
    font-family: Tahoma, Verdana, "Trebuchet MS", sans-serif;
    font-size: 13px;
    overflow: hidden;
    padding: 8px;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,0.12) 2px 3px);
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- окно ---------- */
  .window {
    height: 100%; display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border-hi);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.08), inset -1px -1px 0 rgba(0,0,0,0.6), 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,0.6);
  }
  .titlebar {
    display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px;
    background: linear-gradient(90deg, var(--title-a), var(--title-b));
    color: #e8f1ff; font-weight: bold; text-shadow: 0 0 6px rgba(49,195,255,0.6);
    border-bottom: 1px solid #000; user-select: none;
  }
  .titlebar .icon { width: 14px; height: 14px; border: 1px solid #000; border-radius: 2px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .titlebar .spacer { flex: 1; }
  .titlebar .btns { display: flex; gap: 2px; }
  .titlebar .btns span {
    width: 16px; height: 14px; line-height: 12px; text-align: center; font-size: 10px; color: #cfe;
    background: linear-gradient(#2a3a5e, #111a2e); border: 1px solid #000; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15);
  }
  .menubar {
    display: flex; gap: 14px; padding: 3px 8px;
    background: var(--panel-2); border-bottom: 1px solid var(--border); color: var(--muted);
  }
  .menubar span:hover { color: var(--accent); cursor: pointer; }

  /* ---------- кнопки и поля ---------- */
  .btn {
    color: #eaf6ff; background: linear-gradient(#2c3b5c, #17213a);
    border: 1px solid #000; border-radius: 3px; padding: 4px 10px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.18), inset -1px -1px 0 rgba(0,0,0,0.5);
    text-shadow: 0 1px 0 #000;
  }
  .btn:hover { color: var(--accent); background: linear-gradient(#36497a, #1d2a4a); }
  .btn:active { box-shadow: inset 1px 1px 3px rgba(0,0,0,0.7); }
  .btn.primary { color: #06210f; background: linear-gradient(#7dffb3, #1fbf66); text-shadow: none; font-weight: bold; }
  .btn.primary:hover { color: #06210f; background: linear-gradient(#94ffc2, #29d975); }

  /* ---------- основа ---------- */
  .app { flex: 1; display: flex; min-height: 0; position: relative; }

  /* ---------- список чатов ---------- */
  .sidebar {
    width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    background: #0d121c; border-right: 1px solid var(--border);
  }
  .side-top { display: flex; gap: 6px; padding: 6px; background: var(--panel-2); border-bottom: 1px solid var(--border); }
  .search {
    flex: 1; background: #05080f; border: 1px solid #000; padding: 5px 8px; outline: none;
    box-shadow: inset 1px 1px 3px rgba(0,0,0,0.9);
  }
  .search:focus { box-shadow: inset 1px 1px 3px #000, 0 0 0 1px var(--accent-2); }
  .search::placeholder { color: var(--faint); }
  .folders { display: flex; gap: 4px; padding: 6px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .folders button {
    padding: 3px 8px; font-size: 12px; color: var(--muted); background: #0a0f19;
    border: 1px solid #000; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.05); white-space: nowrap;
  }
  .folders button.on { color: #06210f; background: linear-gradient(#7dffb3, #1fbf66); font-weight: bold; }

  .chats { flex: 1; overflow-y: auto; }
  .chat-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px;
    cursor: pointer; border-left: 2px solid transparent; border-bottom: 1px solid #0a0f19;
  }
  .chat-item:hover { background: #17202f; }
  .chat-item.active { background: #1a2740; border-left-color: var(--accent); }
  .info { flex: 1; min-width: 0; }
  .row1, .row2 { display: flex; align-items: center; gap: 6px; }
  .row1 { margin-bottom: 2px; }
  .name { font-weight: bold; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item.active .name { color: var(--accent); }
  .time { color: var(--faint); font-size: 11px; flex-shrink: 0; }
  .preview { color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .preview b { color: var(--text); font-weight: normal; }
  .ticks { color: var(--accent-2); font-size: 11px; }
  .pin { color: var(--warn); font-size: 11px; }
  .unread {
    background: var(--danger); color: #000; font-size: 10px; font-weight: bold;
    min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center;
    box-shadow: 0 0 6px rgba(255,95,122,0.5);
  }
  .avatar {
    width: 38px; height: 38px; flex-shrink: 0; position: relative;
    display: grid; place-items: center; color: #000; font-weight: bold; font-size: 15px;
    border: 1px solid #000; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.35), inset -1px -1px 0 rgba(0,0,0,0.35);
  }
  .avatar.sm { width: 30px; height: 30px; font-size: 12px; }
  .avatar .online { position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; background: var(--accent); border: 1px solid #000; box-shadow: 0 0 5px var(--accent); }
  .c-blue   { background: linear-gradient(#8fd6ff,#3a7bd5); }
  .c-green  { background: linear-gradient(#b4f5c0,#3f9a4a); }
  .c-orange { background: linear-gradient(#ffd08a,#e0722a); }
  .c-purple { background: linear-gradient(#d2c2ff,#7a5ce0); }
  .c-pink   { background: linear-gradient(#ffc4e3,#d4569a); }

  /* ---------- переписка ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--well); }
  .empty { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; }
  .empty .big { font-size: 26px; color: var(--accent); text-shadow: 0 0 10px rgba(57,255,136,0.5); font-weight: bold; letter-spacing: 2px; }
  .tls-badge { display: inline-block; margin-top: 10px; border: 1px solid var(--accent); color: var(--accent); font-size: 10px; padding: 1px 6px; letter-spacing: 1px; }

  .chat-head {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
  }
  .back { display: none; color: var(--accent); font-size: 18px; padding: 0 6px; }
  .chat-head .meta { flex: 1; min-width: 0; }
  .chat-head .title { color: var(--accent-2); font-weight: bold; }
  .chat-head .status { color: var(--muted); font-size: 11px; }
  .chat-head .status.on { color: var(--accent); }

  .feed {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 3px;
    font-family: "Lucida Console", Consolas, monospace; font-size: 12px;
  }
  .day { align-self: center; color: var(--faint); letter-spacing: 2px; font-size: 11px; margin: 8px 0 4px; }
  .sys { align-self: center; color: var(--muted); font-style: italic; font-size: 11px; margin: 4px 0; }
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .row.out { justify-content: flex-end; }
  .row .avatar { visibility: hidden; }
  .row.first .avatar { visibility: visible; }
  .bubble {
    max-width: 68%; padding: 5px 9px 4px; background: var(--in);
    border: 1px solid #000; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.06), 0 1px 0 rgba(0,0,0,0.6);
    line-height: 1.45; word-wrap: break-word; font-family: Tahoma, Verdana, sans-serif; font-size: 13px;
  }
  .row.out .bubble { background: var(--out); border-color: #0a2a1a; }
  .bubble.tail-in  { border-bottom-left-radius: 0; }
  .bubble.tail-out { border-bottom-right-radius: 0; }
  .sender { font-weight: bold; font-size: 12px; margin-bottom: 1px; }
  .meta-line { float: right; margin: 5px 0 0 10px; font-size: 10px; color: var(--faint); display: flex; gap: 3px; }
  .meta-line .read { color: var(--accent-2); }
  .mention { color: var(--warn); font-weight: bold; }
  .bubble.hl { border-color: var(--warn); box-shadow: 0 0 6px rgba(255,204,102,0.35); }

  .typing { height: 16px; padding: 0 12px; color: var(--accent-2); font-size: 11px; background: var(--well); }

  .composer {
    display: flex; align-items: flex-end; gap: 6px; padding: 6px;
    background: var(--panel-2); border-top: 1px solid var(--border);
  }
  .composer .clip { color: var(--muted); font-size: 16px; padding: 0 4px 6px; }
  .composer .clip:hover { color: var(--accent); }
  .composer textarea {
    flex: 1; resize: none; min-height: 34px; max-height: 110px; height: 34px;
    background: #05080f; border: 1px solid #000; padding: 7px 8px; outline: none;
    box-shadow: inset 1px 1px 3px rgba(0,0,0,0.9); border-radius: 0; font-family: inherit;
  }
  .composer textarea:focus { box-shadow: inset 1px 1px 3px #000, 0 0 0 1px var(--accent-2); }
  .composer textarea::placeholder { color: var(--faint); }

  .statusbar {
    display: flex; gap: 14px; align-items: center; padding: 3px 8px;
    background: var(--panel-2); border-top: 1px solid var(--border); color: var(--muted); font-size: 11px;
  }
  .statusbar .ok { color: var(--accent); }
  .statusbar .spacer { flex: 1; }

  /* ---------- телефон: один экран за раз ---------- */
  @media (max-width: 720px) {
    body { padding: 0; font-size: 14px; }
    .window { border: none; box-shadow: none; }
    .titlebar .btns, .menubar, .statusbar .hide-m { display: none; }
    .sidebar { width: 100%; border-right: none; }
    .main { position: absolute; inset: 0; transform: translateX(100%); transition: transform .2s ease; z-index: 5; }
    .app.chat-open .main { transform: translateX(0); }
    .app.chat-open .sidebar { display: none; }
    .back { display: block; }
    .bubble { max-width: 82%; }
    .composer textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <span class="icon"></span>
    <span>TLS Chat v1.0</span>
    <span class="spacer"></span>
    <div class="btns"><span>_</span><span>□</span><span>×</span></div>
  </div>
  <div class="menubar">
    <span>Файл</span><span>Вид</span><span>Чат</span><span>Контакты</span><span>Настройки</span><span>Справка</span>
  </div>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="side-top">
        <input class="search" id="search" placeholder="Поиск чатов…">
      </div>
      <div class="folders">
        <button class="on" data-f="all">Все</button>
        <button data-f="unread">Непрочитанные</button>
        <button data-f="groups">Каналы</button>
        <button data-f="direct">Личные</button>
      </div>
      <div class="chats" id="chats"></div>
    </aside>

    <section class="main">
      <div class="empty" id="empty">
        <div>
          <div class="big">TLS CHAT</div>
          <div>Выберите чат, чтобы начать переписку</div>
          <span class="tls-badge">🔒 TLS 1.3</span>
        </div>
      </div>

      <div id="conv" style="display:none; flex:1; flex-direction:column; min-height:0">
        <div class="chat-head">
          <span class="back" id="back">‹</span>
          <div class="avatar sm" id="hAvatar"></div>
          <div class="meta">
            <div class="title" id="hTitle"></div>
            <div class="status" id="hStatus"></div>
          </div>
        </div>
        <div class="feed" id="feed"></div>
        <div class="typing" id="typing"></div>
        <div class="composer">
          <span class="clip" title="Вложение">📎</span>
          <textarea id="input" rows="1" placeholder="Сообщение… (Enter — отправить)"></textarea>
          <button class="btn primary" id="send">Отправить</button>
        </div>
      </div>
    </section>
  </div>

  <div class="statusbar">
    <span class="ok">● TLS 1.3 · защищённое соединение</span>
    <span class="spacer"></span>
    <span class="hide-m" id="whoami">alice</span>
  </div>
</div>

<script>
  const ME = "alice";

  const chats = [
    { id: "general", type: "group", name: "Общий", color: "c-blue", unread: 3, pinned: true, members: 12, online: 3,
      msgs: [
        { day: "Сегодня" },
        { sys: "bob добавлен в канал" },
        { from: "bob",   color: "c-green",  text: "Всем доброе утро", t: "09:00" },
        { from: "carol", color: "c-pink",   text: "Доброе! Сервер сегодня поднимали?", t: "09:02" },
        { from: "bob",   color: "c-green",  text: "да, сертификат проверен, всё ок", t: "09:03" },
        { from: ME, out: true, text: "отлично, спасибо!", t: "10:12", read: true },
        { from: "carol", color: "c-pink",   text: "@alice посмотри, пожалуйста, тесты SslContextFactory", t: "10:14", mention: true }
      ] },
    { id: "dev", type: "group", name: "Разработка", color: "c-purple", unread: 2, pinned: true, members: 5, online: 2,
      msgs: [
        { day: "Сегодня" },
        { from: "admin", color: "c-orange", text: "релиз v0.9 в ветке main", t: "10:15" },
        { from: "carol", color: "c-pink",   text: "тесты на SslContextFactory зелёные", t: "10:16" }
      ] },
    { id: "bob", type: "direct", name: "Bob", color: "c-green", online: true, unread: 1,
      msgs: [
        { day: "Вчера" },
        { from: "bob", color: "c-green", text: "Глянешь PR с PBKDF2?", t: "18:40" },
        { from: ME, out: true, text: "да, вечером", t: "18:55", read: true },
        { from: "bob", color: "c-green", text: "принято, жду", t: "19:01" }
      ] },
    { id: "carol", type: "direct", name: "Carol", color: "c-pink", online: true, unread: 0,
      msgs: [
        { day: "Сегодня" },
        { from: "carol", color: "c-pink", text: "Скинь, пожалуйста, новый сертификат для телефона", t: "08:30" },
        { from: ME, out: true, text: "сейчас пришлю файл", t: "08:33", read: true }
      ] },
    { id: "admin", type: "direct", name: "Admin", color: "c-orange", online: false, unread: 0,
      msgs: [
        { day: "Пятница" },
        { from: "admin", color: "c-orange", text: "Аккаунт для тебя создан", t: "12:00" }
      ] },
    { id: "random", type: "group", name: "Флудилка", color: "c-blue", unread: 0, members: 20, online: 5,
      msgs: [
        { day: "Понедельник" },
        { from: "bob", color: "c-green", text: "кто идёт в обед?", t: "12:10" }
      ] }
  ];

  let current = null;
  let filter = "all";
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const initials = n => n.trim().slice(0, 1).toUpperCase();
  const now = () => new Date().toTimeString().slice(0, 5);
  const nameColor = cls => ({ "c-blue":"#8fd6ff","c-green":"#7bd389","c-orange":"#ffb35c","c-purple":"#b59cff","c-pink":"#ff9ec9" }[cls] || "#8fd6ff");

  // последнее сообщение чата (для превью)
  const lastOf = c => [...c.msgs].reverse().find(m => !m.day && !m.sys);

  function visibleChats() {
    const q = $("search").value.trim().toLowerCase();
    return chats
      .filter(c => !q || c.name.toLowerCase().includes(q))
      .filter(c => filter === "all" ||
        (filter === "unread" && c.unread > 0) ||
        (filter === "groups" && c.type === "group") ||
        (filter === "direct" && c.type === "direct"))
      .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  }

  function renderChats() {
    $("chats").innerHTML = visibleChats().map(c => {
      const last = lastOf(c) || { text: "", t: "" };
      const prefix = last.out ? "Вы: " : (c.type === "group" && last.from ? `${last.from}: ` : "");
      const ticks = last.out ? `<span class="ticks">${last.read ? "✓✓" : "✓"}</span>` : "";
      return `
        <div class="chat-item ${current === c.id ? "active" : ""}" data-id="${c.id}">
          <div class="avatar ${c.color}">${initials(c.name)}${c.type === "direct" && c.online ? '<span class="online"></span>' : ""}</div>
          <div class="info">
            <div class="row1">
              <span class="name">${esc(c.name)}</span>
              ${c.pinned ? '<span class="pin">📌</span>' : ""}
              <span class="time">${last.t}</span>
            </div>
            <div class="row2">
              ${ticks}
              <span class="preview">${esc(prefix)}<b>${esc(last.text)}</b></span>
              ${c.unread ? `<span class="unread">${c.unread}</span>` : ""}
            </div>
          </div>
        </div>`;
    }).join("") || `<div style="padding:16px;color:var(--faint);text-align:center">Ничего не найдено</div>`;
  }

  function renderConv() {
    const c = chats.find(x => x.id === current);
    if (!c) return;
    $("empty").style.display = "none";
    $("conv").style.display = "flex";
    $("hAvatar").className = "avatar sm " + c.color;
    $("hAvatar").textContent = initials(c.name);
    $("hTitle").textContent = c.type === "group" ? "#" + c.name.toLowerCase() : c.name;
    $("hStatus").className = "status" + (c.type === "direct" && c.online ? " on" : "");
    $("hStatus").textContent = c.type === "group"
      ? `${c.members} участников, ${c.online} в сети`
      : (c.online ? "в сети" : "был(а) недавно");

    let html = "";
    let prev = null;
    c.msgs.forEach(m => {
      if (m.day) { html += `<div class="day">──── ${m.day} ────</div>`; prev = null; return; }
      if (m.sys) { html += `<div class="sys">** ${esc(m.sys)}</div>`; prev = null; return; }
      const first = m.from !== prev;
      prev = m.from;
      const text = esc(m.text).replace(/@(\w+)/g, '<span class="mention">@$1</span>');
      const sender = !m.out && c.type === "group" && first
        ? `<div class="sender" style="color:${nameColor(m.color)}">&lt;${esc(m.from)}&gt;</div>` : "";
      const tail = first ? (m.out ? "tail-out" : "tail-in") : "";
      html += `
        <div class="row ${m.out ? "out" : ""} ${first ? "first" : ""}">
          ${!m.out ? `<div class="avatar sm ${m.color}">${initials(m.from)}</div>` : ""}
          <div class="bubble ${tail} ${m.mention ? "hl" : ""}">
            ${sender}${text}
            <span class="meta-line">${m.t}${m.out ? `<span class="read">${m.read ? "✓✓" : "✓"}</span>` : ""}</span>
          </div>
        </div>`;
    });
    $("feed").innerHTML = html;
    $("feed").scrollTop = $("feed").scrollHeight;
    $("app").classList.add("chat-open");
  }

  function openChat(id) {
    current = id;
    const c = chats.find(x => x.id === id);
    c.unread = 0;
    renderChats();
    renderConv();
  }

  function send() {
    const text = $("input").value.trim();
    if (!text || !current) return;
    const c = chats.find(x => x.id === current);
    const msg = { from: ME, out: true, text, t: now(), read: false };
    c.msgs.push(msg);
    $("input").value = "";
    renderChats();
    renderConv();

    // имитация: сообщение прочитано, затем ответ собеседника
    setTimeout(() => { msg.read = true; renderChats(); if (current === c.id) renderConv(); }, 800);
    $("typing").textContent = c.type === "direct" ? `${c.name} печатает…` : "";
    setTimeout(() => {
      $("typing").textContent = "";
      const reply = { from: c.type === "direct" ? c.name.toLowerCase() : "bob",
                      color: c.color, text: "принято ✓", t: now() };
      c.msgs.push(reply);
      if (current === c.id) renderConv();
      renderChats();
    }, 1800);
  }

  $("chats").addEventListener("click", e => {
    const item = e.target.closest(".chat-item");
    if (item) openChat(item.dataset.id);
  });
  document.querySelectorAll(".folders button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".folders button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    filter = b.dataset.f;
    renderChats();
  }));
  $("search").addEventListener("input", renderChats);
  $("send").addEventListener("click", send);
  $("input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("back").addEventListener("click", () => $("app").classList.remove("chat-open"));

  renderChats();
  openChat("general");
</script>
</body>
