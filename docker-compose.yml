services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tlschat
      POSTGRES_USER: tlschat
      POSTGRES_PASSWORD: change-this-in-production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlschat -d tlschat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      PORT: 8080
      WS_PORT: 8081
      DATABASE_URL: postgresql://tlschat:change-this-in-production@postgres:5432/tlschat
      FILE_STORAGE_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres-data:
  uploads-data:
