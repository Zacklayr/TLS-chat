name: TLS-Chat Heroku deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: Heroku application name
        required: true
        default: avengers-chat-8022390115f6
        type: string
      smoke_test:
        description: Run HTTPS smoke checks after deployment
        required: true
        default: true
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: heroku
    concurrency:
      group: tls-chat-heroku-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ inputs.app_name || vars.HEROKU_APP_NAME || 'avengers-chat-8022390115f6' }}
      HEROKU_APP_URL: ${{ secrets.HEROKU_APP_URL || format('https://{0}.herokuapp.com', inputs.app_name || vars.HEROKU_APP_NAME || 'avengers-chat-8022390115f6') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$HEROKU_API_KEY" || { echo "HEROKU_API_KEY is not configured in the heroku environment"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "HEROKU_APP_NAME is not configured"; exit 1; }
      - name: Push source to Heroku
        shell: bash
        run: |
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git"
          git push heroku "HEAD:main"
      - name: Run published smoke test
        if: ${{ (github.event_name == 'push' || inputs.smoke_test) && env.HEROKU_APP_URL != '' }}
        shell: pwsh
        run: ./infra/smoke-test.ps1 -BaseUrl "$env:HEROKU_APP_URL"
