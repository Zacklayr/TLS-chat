name: TLS-Chat CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests
        run: mvn -B verify
      - name: Upload packaged clients
        uses: actions/upload-artifact@v4
        with:
          name: tls-chat-java-clients
          path: |
            target/tls-chat-desktop-jar-with-dependencies.jar
            target/tls-chat-registrar-jar-with-dependencies.jar
          if-no-files-found: error
          retention-days: 14
